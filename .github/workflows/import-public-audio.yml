name: import public audio

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-public-audio.yml"
      - "scripts/fetch-public-audio.sh"
      - "manifest.tsv"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch redistributable originals
        run: sh scripts/fetch-public-audio.sh
      - name: Commit fetched audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/original CHECKSUMS.sha1 CHECKSUMS.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import public and freely licensed sound recordings"
          git push
